[project]
name = "snowflake-setup-cli"
version = "0.1.0"
description = "Automated Snowflake setup CLI with Copilot Agent assistance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27.2,<0.28",
    "rich>=15.0.0,<16",
    "github-copilot-sdk>=1.0.16,<2",
]

[project.scripts]
snowflake-setup = "main:app"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
