[project]
name = "snowflake-setup-cli"
version = "0.1.0"
description = "Automated Snowflake setup CLI with Copilot Agent assistance"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.19.2",
    "rich>=13.0.0",
    "github-copilot-sdk>=0.1.0",
]

[project.scripts]
snowflake-setup = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
