name: Documentation

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "config/evsnow.example.toml"
      - "generate_snowflake_keys.sh"
      - "setup_snowflake.sql"
      - "setup_snowpipe_streaming.sql"
      - "tools/quickstart_harness.py"
      - "tools/eventhub_sender/**"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "config/evsnow.example.toml"
      - "generate_snowflake_keys.sh"
      - "setup_snowflake.sql"
      - "setup_snowpipe_streaming.sql"
      - "tools/quickstart_harness.py"
      - "tools/eventhub_sender/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Zensical site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install docs dependencies
        run: uv sync --group docs --locked

      - name: Build documentation
        run: uv run zensical build --clean --strict

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
