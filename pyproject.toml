[project]
name = "evsnow"
version = "0.3.0"
description = "EvSnow - Azure EventHub to Snowflake streaming pipeline"
readme = "README.md"
authors = [
    { name = "MiguelElGallo", email = "60221874+MiguelElGallo@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-eventhub>=5.15.1",
    "azure-identity>=1.26.0",
    "aiohttp>=3.14.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "pydantic-ai[groq,cohere]>=2.54.0,<3",
    "logfire>=5.1.1,<6",
    "psycopg[binary]>=3.3.6",
    "snowflake-connector-python>=4.8.0,<5",
    "cryptography>=50.0.2,<51",
    "snowpipe-streaming>=1.8.1",
]

[project.scripts]
evsnow = "main:cli_main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evsnow", "src/consumers", "src/pipeline", "src/streaming", "src/utils"]

[tool.hatch.build.targets.wheel.force-include]
"src/main.py" = "main.py"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "azure.*",
    "pydantic.*",
    "pydantic_settings.*",
    "dotenv.*",
    "typer.*",
    "rich.*",
    "snowflake.*"
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "ty>=0.0.84",
    "pytest-codspeed>=5.0.3",
]
docs = [
    "zensical==0.0.68",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
testpaths = ["tests"]
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
    "asyncio: mark test as async",
    "slow: mark test as slow running",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "strict"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
