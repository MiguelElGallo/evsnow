[project]
site_name = "EvSnow"
site_description = "Azure Event Hubs to Snowflake streaming pipeline documentation"
site_author = "MiguelElGallo"
site_url = "https://miguelelgallo.github.io/evsnow/"
repo_url = "https://github.com/MiguelElGallo/evsnow"
repo_name = "MiguelElGallo/evsnow"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
copyright = "&copy; 2026 MiguelElGallo"

nav = [
  { "Overview" = "index.md" },
  { "Tutorial" = [
    "tutorial/index.md",
    "tutorial/first-run.md"
  ] },
  { "Setup" = [
    "getting-started/index.md",
    "getting-started/event-hub-quickstart.md",
    "getting-started/snowflake-quickstart.md",
    "snowflake/key-pair-auth.md"
  ] },
  { "How-to Guides" = [
    "how-to/index.md",
    "how-to/query-iceberg-with-duckdb.md"
  ] },
  { "Reference" = [
    "reference/index.md",
    "configuration.md",
    "reference/parameters.md",
    "snowflake/complete-setup.md"
  ] },
  { "Tools" = [
    "tools/index.md",
    "tools/eventhub-sender.md"
  ] },
  { "Development" = [
    "development/index.md",
    "development/testing.md",
    "development/integration-tests.md"
  ] },
  { "Project" = [
    "project/index.md",
    "project/workflows.md",
    "project/copilot-instructions.md",
    { "Archive" = [
      "project/issue-creation-guide.md",
      "python-pipeline-hardening-plan.md",
      "archive/control-table-postgres-plan.md",
      "archive/snowflake-setup-cli-plan.md",
      "tools/snowflake-setup-cli.md",
      "development/unit/orchestrator-tests.md",
      "development/unit/streaming-tests.md",
      "development/unit/streaming-coverage.md",
      "development/unit/streaming-implementation-summary.md",
      "development/unit/test-orchestrator-note.md"
    ] },
    { "GitHub" = "https://github.com/MiguelElGallo/evsnow" }
  ] }
]

[project.theme]
variant = "modern"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "search.highlight",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.tracking",
  "navigation.top",
  "toc.follow"
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
